name: Build OrangeFox Recovery (malachite)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # OrangeFox manifest (fox_16.0 = Android 16 based, the only active branch)
  MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git
  MANIFEST_BRANCH: fox_16.0
  # Verified device tree base (TWRP for malachite, Android 16, hardware-tested)
  DEVICE_TREE_URL: https://github.com/mytiantian001/android_device_xiaomi_malachite_twrp
  DEVICE_TREE_BRANCH: A16
  DEVICE_PATH: device/xiaomi/malachite
  DEVICE_CODENAME: malachite
  # Recovery lives in vendor_boot on this device (A/B, no dedicated recovery partition)
  BUILD_TARGET: vendorbootimage
  # Shown inside the recovery UI
  MAINTAINER: Unofficial Builder

jobs:
  build:
    name: Build OrangeFox Unofficial (malachite)
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/android /opt/pipx
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h /

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip curl build-essential libncurses5 \
            libgl1-mesa-dev libxml2-utils xsltproc unzip rsync >/dev/null
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@users.noreply.github.com"

      - name: Sync OrangeFox source tree (fox_16.0)
        run: |
          set -e
          mkdir -p workspace/fox_16.0
          cd workspace/fox_16.0
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c -j8 --no-tags --fail-fast || repo sync -c -j4 --no-tags --fail-fast
          echo "Sync finished. Disk usage:"
          df -h /

      - name: Verify synced tree
        run: |
          set -e
          cd workspace/fox_16.0
          FAIL=0
          # Mandatory entries: the build cannot proceed without them.
          if [ ! -f build/envsetup.sh ]; then
            echo "ERROR: build/envsetup.sh is missing. repo sync did not complete correctly."
            FAIL=1
          fi
          if [ ! -f vendor/twrp/config/common.mk ]; then
            echo "ERROR: vendor/twrp/config/common.mk is missing (inherited by the device tree)."
            FAIL=1
          fi
          if [ ! -d vendor/recovery ]; then
            echo "ERROR: vendor/recovery is missing (OrangeFox build system layer)."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          # Informational only: a root-level vendorsetup.sh is a legacy AOSP artifact.
          # fox_16.0 does NOT ship one and does NOT need it — product discovery is
          # done through AndroidProducts.mk. Never fail the build over it.
          if [ ! -f vendorsetup.sh ]; then
            echo "NOTE: root vendorsetup.sh is absent — normal for fox_16.0, continuing."
          fi
          echo "Synced tree verified."
          ls | head -20

      - name: Prepare device tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/workspace/fox_16.0"
          git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_PATH"
          echo "Device tree cloned:"
          ls -la "$DEVICE_PATH"

      - name: Apply device patches to bootable/recovery
        run: |
          set -e
          REPO_DIR="$GITHUB_WORKSPACE/workspace/fox_16.0"
          PATCH="$REPO_DIR/$DEVICE_PATH/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch"
          if [ ! -f "$PATCH" ]; then
            echo "No patch present, skipping."
            exit 0
          fi
          # Required per the device tree README: prevents an optional vibration
          # request from blocking the touch interface before servicemanager is up.
          if git -C "$REPO_DIR/bootable/recovery" apply --check "$PATCH" 2>/dev/null; then
            git -C "$REPO_DIR/bootable/recovery" apply "$PATCH"
            echo "Haptics patch applied to bootable/recovery."
          elif patch -d "$REPO_DIR/bootable/recovery" -p1 --forward --dry-run < "$PATCH" >/dev/null 2>&1; then
            patch -d "$REPO_DIR/bootable/recovery" -p1 --forward < "$PATCH"
            echo "Haptics patch applied with patch(1)."
          else
            echo "WARNING: patch does not apply cleanly (likely already fixed upstream). Continuing."
          fi

      - name: Add OrangeFox device configuration
        run: |
          set -e
          REPO_DIR="$GITHUB_WORKSPACE/workspace/fox_16.0"
          # Pattern taken from the official OrangeFox fox_16.0 reference tree
          # (device/xiaomi/mondrian), adapted for an A/B vendor_boot-only device:
          # no OF_AB_DEVICE_WITH_RECOVERY_PARTITION here, because malachite has
          # no dedicated recovery partition (recovery lives in vendor_boot).
          cat >> "$REPO_DIR/$DEVICE_PATH/BoardConfig.mk" <<EOF

          # ---- OrangeFox Recovery (fox_16.0) ----
          OF_AB_DEVICE := 1
          OF_SCREEN_H := 2712
          OF_STATUS_INDENT_LEFT := 48
          OF_STATUS_INDENT_RIGHT := 48
          OF_CLOCK_POS := 1
          OF_ADVANCED_SECURITY := 1
          OF_MAINTAINER := "$MAINTAINER"
          EOF
          echo "OrangeFox configuration appended:"
          tail -12 "$REPO_DIR/$DEVICE_PATH/BoardConfig.mk"

      - name: Strip non-essential files from the device tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/workspace/fox_16.0/$DEVICE_PATH"
          # Housekeeping before building: docs, metadata and the (already
          # applied) patch set are not needed by the build system.
          rm -rf .git .github README.md docs patches
          echo "Device tree after cleanup:"
          ls -la

      - name: Build vendor_boot image
        run: |
          cd "$GITHUB_WORKSPACE/workspace/fox_16.0"
          # Product name comes from the device tree's AndroidProducts.mk
          # (fox_16.0 convention keeps the TWRP-style name, e.g. twrp_malachite).
          PRODUCT=$(grep -m1 -oE '(twrp|fox|omni)_[A-Za-z0-9_]+' "$DEVICE_PATH/AndroidProducts.mk" | head -n1)
          if [ -z "$PRODUCT" ]; then
            echo "ERROR: could not detect the product name in $DEVICE_PATH/AndroidProducts.mk"
            exit 1
          fi
          echo "Building product: $PRODUCT"
          source build/envsetup.sh
          if lunch "$PRODUCT-eng"; then
            echo "Lunched $PRODUCT-eng"
          else
            # Modern manifests require a release config segment
            # (<product>-<release>-<variant>). Pick the first matching combo
            # offered by the lunch menu instead of hard-coding a release name.
            lunch > /tmp/lunch_menu.log 2>&1 || true
            CAND=$(grep -oE "$PRODUCT-[A-Za-z0-9_]+-eng" /tmp/lunch_menu.log | head -n1)
            if [ -z "$CAND" ]; then
              echo "ERROR: no usable lunch target found. Menu output:"
              tail -60 /tmp/lunch_menu.log
              exit 1
            fi
            echo "Lunching $CAND"
            lunch "$CAND" || { echo "ERROR: lunch failed"; exit 1; }
          fi
          mka "$BUILD_TARGET"

      - name: Collect build artifacts
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/workspace/fox_16.0"
          OUT="out/target/product/$DEVICE_CODENAME"
          IMG="$OUT/vendor_boot.img"
          if [ ! -f "$IMG" ]; then
            echo "ERROR: vendor_boot.img was not produced. Contents of $OUT:"
            ls -la "$OUT" 2>/dev/null || true
            find out/target/product -maxdepth 2 -name '*.img' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IMG" "$GITHUB_WORKSPACE/artifacts/OrangeFox-Unofficial-$DEVICE_CODENAME.img"
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -9 "OrangeFox-Unofficial-$DEVICE_CODENAME.zip" "OrangeFox-Unofficial-$DEVICE_CODENAME.img"
          sha256sum * > sha256sums.txt
          ls -la
          {
            echo "### OrangeFox Unofficial — $DEVICE_CODENAME"
            echo '```'
            cat sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Unofficial-malachite
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
