name: Build OrangeFox Recovery

env:
  FOX_MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git
  FOX_BRANCH: fox_16.0
  SYNC_JOBS: 6
  BUILD_JOBS: 2
  MIN_FREE_MB: 20000
  SWAP_MAX_MB: 30720
  SWAP_MIN_MB: 4096

on:
  workflow_dispatch:
    inputs:
      selinux_permissive:
        description: Add androidboot.selinux=permissive to the vendor cmdline only if the recovery fails to boot with SELinux enforcing
        required: false
        default: false
        type: boolean
      slim_sync:
        description: Skip emulator/google/linaro device trees and GKI kernel prebuilts during the sync (smaller tree, much smaller soong analysis). Turn off only if the build complains about a missing module.
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build OrangeFox for malachite
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout build package
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Prepare workspace and check disk space
        run: |
          echo "CPU: $(nproc --all) | RAM: $(free -g | awk '/Mem:/ {print $2}') GB"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google \
            /usr/local/share/powershell /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/share/miniconda \
            /usr/local/julia* /usr/lib/firefox /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /tmp/swapfile || true
          df -h / /mnt
          ROOT_MB=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          MNT_MB=$(df -BM --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          MNT_MB=${MNT_MB:-0}
          if [ "$MNT_MB" -gt "$ROOT_MB" ]; then
            sudo mkdir -p /mnt/fox && sudo chown -R "$(id -u):$(id -g)" /mnt/fox
            ln -sfn /mnt/fox /home/runner/fox
            AVAIL=$MNT_MB
            mkdir -p "$HOME/fox-out"
            OUTVAL="$HOME/fox-out"
            echo "OUT_DIR=$OUTVAL" >> "$GITHUB_ENV"
          else
            mkdir -p /home/runner/fox
            AVAIL=$ROOT_MB
            if [ "$MNT_MB" -gt 10000 ]; then
              sudo mkdir -p /mnt/fox-out && sudo chown -R "$(id -u):$(id -g)" /mnt/fox-out
              OUTVAL=/mnt/fox-out
              echo "OUT_DIR=$OUTVAL" >> "$GITHUB_ENV"
            else
              mkdir -p "$HOME/fox-out"
              OUTVAL="$HOME/fox-out"
              echo "OUT_DIR=$OUTVAL" >> "$GITHUB_ENV"
            fi
          fi
          echo "Source tree goes to $HOME/fox, ${AVAIL} MB free on that disk, build output goes to ${OUTVAL}"
          if [ "$AVAIL" -lt "$MIN_FREE_MB" ]; then
            echo "::error::Not enough disk space (${AVAIL} MB free). At least ${MIN_FREE_MB} MB is required."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core git-lfs gnupg flex bison \
            build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip lz4 bc ccache rsync libssl-dev openjdk-17-jdk
          mkdir -p $HOME/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false
          git config --global gc.auto 0
          git lfs install
          sudo apt-get clean

      - name: Sync OrangeFox fox_16.0 source tree
        timeout-minutes: 110
        env:
          SLIM: ${{ inputs.slim_sync }}
        run: |
          mkdir -p $HOME/fox && cd $HOME/fox
          OK=0
          for i in 1 2 3; do
            rm -rf .repo
            if repo init --depth=1 -u "$FOX_MANIFEST_URL" -b "$FOX_BRANCH"; then OK=1; break; fi
            echo "repo init attempt $i failed, retrying in 15 seconds"
            sleep 15
          done
          if [ "$OK" != 1 ]; then
            echo "::error::repo init failed for $FOX_MANIFEST_URL branch $FOX_BRANCH"
            exit 1
          fi
          if [ "$SLIM" = "true" ]; then
            if [ -f "$GITHUB_WORKSPACE/device_tree/local_manifests/slim.xml" ]; then
              mkdir -p .repo/local_manifests
              cp "$GITHUB_WORKSPACE/device_tree/local_manifests/slim.xml" .repo/local_manifests/slim.xml
              echo "Slim sync enabled: $(grep -c 'remove-project' .repo/local_manifests/slim.xml) projects dropped from the manifest"
            else
              echo "::warning::slim_sync is true but local_manifests/slim.xml is missing in this repo, syncing the full manifest"
            fi
          else
            echo "Slim sync disabled by input, syncing the full manifest"
          fi
          (
            while true; do
              sleep 120
              A=$(df -BM --output=avail "$HOME/fox" 2>/dev/null | tail -1 | tr -dc '0-9')
              echo "[watch] $(date -u +%H:%M:%S) source disk ${A:-unknown} MB free"
            done
          ) &
          LOGGER=$!
          SYNC_START=$(date -u +%s)
          set +e
          repo sync -c -j"$SYNC_JOBS" --force-sync --no-clone-bundle --no-tags
          RC=$?
          if [ "$RC" != 0 ]; then
            echo "First sync pass failed with code $RC, retrying with 2 jobs"
            repo sync -c -j2 --force-sync --no-clone-bundle --no-tags
            RC=$?
          fi
          if [ "$RC" != 0 ]; then
            echo "Second sync pass failed with code $RC, final retry with 1 job"
            repo sync -c -j1 --force-sync --no-clone-bundle --no-tags
            RC=$?
          fi
          kill "$LOGGER" 2>/dev/null || true
          echo "Sync finished with code $RC after $(( ($(date -u +%s) - SYNC_START) / 60 )) minutes"
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          exit $RC

      - name: Place the malachite device tree
        run: |
          set -e
          cd $HOME/fox
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/malachite
          cp -a "$GITHUB_WORKSPACE/device_tree" device/xiaomi/malachite
          test -f device/xiaomi/malachite/twrp_malachite.mk
          test -f device/xiaomi/malachite/prebuilt/dtb
          rm -rf device/xiaomi/malachite/.git
          cd device/xiaomi/malachite
          (git init -q -b main && git add -A && git commit -qm "malachite OrangeFox device tree") || echo "Device tree git init skipped, continuing without it"

      - name: Apply the recovery touch haptics patch
        run: |
          cd $HOME/fox
          P=device/xiaomi/malachite/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch
          if git -C bootable/recovery apply --check "$PWD/$P"; then
            git -C bootable/recovery apply "$PWD/$P"
            echo "Haptics patch applied"
          elif git -C bootable/recovery apply --check --3way "$PWD/$P"; then
            git -C bootable/recovery apply --3way "$PWD/$P"
            echo "Haptics patch applied with a 3way merge"
          else
            echo "::error::Haptics patch does not apply to this bootable/recovery revision"
            exit 1
          fi

      - name: Apply the flashlight toggle patch
        run: |
          cd $HOME/fox
          P=device/xiaomi/malachite/patches/0002-flashlight-toggle-by-saved-state.patch
          git -C bootable/recovery apply "$PWD/$P" || { echo "::error::Flashlight patch does not apply"; exit 1; }
          echo "Flashlight patch applied"

      - name: Apply the India time zone patch
        run: |
          cd $HOME/fox
          P=device/xiaomi/malachite/patches/0003-india-timezone.patch
          git -C bootable/recovery apply "$PWD/$P" || { echo "::error::India time zone patch does not apply"; exit 1; }
          echo "India time zone patch applied"

      - name: Apply the format data fix patch
        run: |
          cd $HOME/fox
          P=device/xiaomi/malachite/patches/0004-remove-data-dm-before-format.patch
          if git -C bootable/recovery apply --check "$PWD/$P"; then
            git -C bootable/recovery apply "$PWD/$P"
            echo "Format data patch applied"
          elif git -C bootable/recovery apply --check --3way "$PWD/$P"; then
            git -C bootable/recovery apply --3way "$PWD/$P"
            echo "Format data patch applied with a 3way merge"
          else
            echo "::error::Format data patch does not apply to this bootable/recovery revision"
            exit 1
          fi

      - name: Use the maintainer avatar
        run: |
          cd $HOME/fox
          cp device/xiaomi/malachite/recovery/maintainer/maintainer.png bootable/recovery/gui/theme/portrait_hdpi/images/Default/About/maintainer.png

      - name: Trim repo metadata and create build swap
        run: |
          cd $HOME/fox
          rm -rf .repo/project-objects .repo/worktrees
          TREE_DEV=$(df --output=source "$HOME/fox" | tail -1)
          OUT_DEV=$(df --output=source "$OUT_DIR" | tail -1)
          FREE_MB=$(df -BM --output=avail "$HOME/fox" | tail -1 | tr -dc '0-9')
          if [ "$TREE_DEV" = "$OUT_DEV" ]; then
            KEEP_MB=12288
            echo "::warning::The build output shares the source tree disk, swap will be kept small"
          else
            KEEP_MB=2048
          fi
          SWAP_MB=$(( FREE_MB - KEEP_MB ))
          [ "$SWAP_MB" -gt "$SWAP_MAX_MB" ] && SWAP_MB=$SWAP_MAX_MB
          [ "$SWAP_MB" -lt "$SWAP_MIN_MB" ] && SWAP_MB=$SWAP_MIN_MB
          if [ "$(df --output=target "$HOME/fox" | tail -1)" = "/mnt" ]; then
            SWAPFILE=/mnt/swapfile
          else
            SWAPFILE=/tmp/swapfile
          fi
          echo "Tree disk ${FREE_MB} MB free, creating ${SWAP_MB} MB swap at ${SWAPFILE}"
          sudo fallocate -l "${SWAP_MB}M" "$SWAPFILE" 2>/dev/null || true
          if [ -f "$SWAPFILE" ]; then
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE" || true
            sudo swapon "$SWAPFILE" || echo "::warning::swapon failed, the build will rely on RAM only"
          else
            echo "::warning::No swap could be created, the build will rely on RAM only"
          fi
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          free -h
          swapon --show || true

      - name: Build OrangeFox vendor_boot image
        timeout-minutes: 230
        env:
          PERM: ${{ inputs.selinux_permissive }}
        run: |
          cd $HOME/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=malachite
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          # GOMEMLIMIT is intentionally not set: soong_build does not inherit this
          # environment (build/soong/ui/build/soong.go builds its invocationEnv
          # explicitly), so it never reached the analysis process. The memory
          # levers here are the slim manifest, the 30G swap and -j2.
          export _JAVA_OPTIONS=-Xmx2g
          ulimit -c 0
          if [ "$PERM" = "true" ]; then export MALACHITE_RECOVERY_PERMISSIVE=true; fi
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          free -h
          swapon --show || true
          BUILD_START=$(date -u +%s)
          (
            while true; do
              sleep 120
              A=$(df -BM --output=avail "$HOME/fox" 2>/dev/null | tail -1 | tr -dc '0-9')
              B=$(df -BM --output=avail "$OUT_DIR" 2>/dev/null | tail -1 | tr -dc '0-9')
              R=$(free -m | awk '/^Mem:/ {print $7}')
              S=$(free -m | awk '/^Swap:/ {print $3}')
              T=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s=%dMB ", $2, $1/1024}')
              echo "[watch] $(date -u +%H:%M:%S) source ${A:-unknown} MB free, output ${B:-unknown} MB free, ram available ${R:-unknown} MB, swap used ${S:-unknown} MB, top ${T:-none}"
            done
          ) &
          LOGGER=$!
          set +e
          source build/envsetup.sh
          LUNCHED=0
          for T in twrp_malachite-bp2a-eng twrp_malachite-ap2a-eng twrp_malachite-eng; do
            echo "Trying lunch target $T at $(date -u +%H:%M:%S)"
            if lunch "$T"; then LUNCHED=1; break; fi
          done
          if [ "$LUNCHED" != 1 ]; then
            echo "::error::No valid lunch target for twrp_malachite on this OrangeFox source tree"
            kill "$LOGGER" 2>/dev/null || true
            exit 1
          fi
          echo "Lunch done at $(date -u +%H:%M:%S), elapsed $(( ($(date -u +%s) - BUILD_START) / 60 )) minutes, starting mka vendorbootimage"
          mka vendorbootimage -j"$BUILD_JOBS" 2>&1 | tee $HOME/build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != 0 ] && grep -qE "out of memory|bad_alloc|OutOfMemoryError|Killed|signal 9|exit code 137|cannot allocate" $HOME/build.log 2>/dev/null; then
            echo "Build failed in a way that looks memory related, retrying with -j1 (ninja resumes the finished work)"
            mka vendorbootimage -j1 2>&1 | tee -a $HOME/build.log
            RC=${PIPESTATUS[0]}
          fi
          kill "$LOGGER" 2>/dev/null || true
          echo "Build finished with code $RC after $(( ($(date -u +%s) - BUILD_START) / 60 )) minutes"
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          exit $RC

      - name: Collect build outputs
        run: |
          OUT=$OUT_DIR/target/product/malachite
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ ! -f "$OUT/vendor_boot.img" ]; then
            echo "::error::vendor_boot.img was not produced"
            tail -50 $HOME/build.log || true
            exit 1
          fi
          # vendor_boot.img is not shipped: it has no kernel modules and stops the ROM from booting if flashed
          find "$OUT" -maxdepth 1 -name "OrangeFox*.zip" -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          if ! ls "$GITHUB_WORKSPACE"/output/OrangeFox*.zip >/dev/null 2>&1; then
            echo "::error::The OrangeFox zip was not produced"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/output"
          sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt
          ls -lh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-malachite
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-build-log
          path: /home/runner/build.log
          if-no-files-found: ignore
          retention-days: 30
