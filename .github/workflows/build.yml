# =============================================================================
# UNOFFICIAL OrangeFox Recovery build for Redmi Note 14 Pro 5G (malachite)
# =============================================================================
#
# Design notes:
#
#   * Device : Redmi Note 14 Pro 5G (malachite) - MT6878 (Dimensity 7300 Ultra),
#              GKI kernel 6.1, HyperOS 2 Global (2.0.208.0.VOOMIXM), A/B with
#              virtual-ab; recovery lives in vendor_boot (boot header v4).
#   * Base   : OrangeFox fox_16.0 (Android 16, release config bp2a) - matches
#              the Android 16 ROMs to be installed (PixelOS 16.2, LineageOS 23.2).
#   * Device tree : proven community tree mytiantian001/android_device_xiaomi_malachite_twrp
#              (branch A16, hardware-tested, target = mka vendorbootimage),
#              pulled at build time via a generated local manifest. Binary
#              assets it ships (prebuilt dtb, miui releasekey) cannot be inlined
#              as text, so this workflow file remains the ONLY repo file.
#   * Fox-ify: generates the OrangeFox device-tree contract at build time:
#              vendorsetup.sh (FOX_* build vars, official amethyst template),
#              fox_malachite.mk (OF_* UI flags), wires it into twrp_malachite.mk,
#              applies the proven minuitwrp haptics patch when applicable.
#   * Sync guards (proven in earlier iterations):
#              - dangling <remove-project> auto-fix (repo manifest parse loop)
#              - dynamic overlay dropping OrangeFox repos pinned to privately
#                fetchable revisions (external/libarchive, external/libfuse3,
#                external/icu, external/fox-go) - intersected with the current
#                manifest so it can never dangle; consumer-drift early warning
#              - warning-only pre-flight ls-remote of OrangeFox-remote projects
#              - sync retry ladder -j8 fail-fast -> -j4 -> -j2 (incremental)
#   * Anti-OOM (new in this iteration - the previous run died when soong_build
#     reached 14.4 GB RSS on a 15 GB runner with only 3 GB swap):
#              - 16 GB swapfile + vm.swappiness=100
#              - GOMEMLIMIT caps the Go heap of soong_build (it is a Go binary)
#              - aggressive GitHub-runner disk cleanup (~25-30 GB freed)
#              - ninja parallelism capped at -j2 (input-tunable)
#              - auto-retry with "missing/unknown module" device-tree repair
#
#   Output: vendor_boot image (fastboot flash vendor_boot) + OrangeFox zip if
#   the build packages one. ADB sideload and A/B OTA (payload.bin) zip install
#   are included via update_engine_sideload in the device tree.
#
# =============================================================================

name: Build OrangeFox (UNOFFICIAL) — malachite

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox manifest branch (gitlab.com/OrangeFox/Manifest)"
        required: false
        default: "fox_16.0"
      gomemlimit:
        description: "Go heap limit for soong_build (anti-OOM). Raise to 14GiB only if the build GC-thrashes."
        required: false
        default: "12GiB"
      build_jobs:
        description: "Ninja parallel jobs (2 recommended on a 16 GB / 4-core runner)"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: fox-malachite-build
  cancel-in-progress: true

jobs:
  build:
    name: OrangeFox fox_16.0 / malachite / vendor_boot
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git
      MANIFEST_BRANCH: ${{ inputs.fox_branch || 'fox_16.0' }}
      DEVICE: malachite
      DT_REPO: mytiantian001/android_device_xiaomi_malachite_twrp
      DT_BRANCH: A16
      SRC: /home/runner/work/foxsrc
      GOMEMLIMIT: ${{ inputs.gomemlimit || '12GiB' }}
      GOGC: "60"
      BUILD_JOBS: ${{ inputs.build_jobs || '2' }}
      CCACHE_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 1 - free disk space and create a big swapfile (anti-OOM core)
      # ------------------------------------------------------------------
      - name: Free disk space and add swap (anti-OOM)
        run: |
          echo "=== BEFORE ==="
          df -h / /mnt 2>/dev/null || true
          free -h || true

          # Purge large preinstalled toolchains we never use (~25-30 GB).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/lib/node_modules /opt/microsoft \
            /opt/google /usr/local/share/powershell 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # Replace the tiny default swap with a 16 GB one.
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          FREE_ROOT=$(df -k / --output=avail | tail -n1 | tr -dc '0-9')
          FREE_MNT=$(df -k /mnt --output=avail 2>/dev/null | tail -n1 | tr -dc '0-9')
          FREE_MNT=${FREE_MNT:-0}
          if [ "$FREE_MNT" -gt "$FREE_ROOT" ]; then SWAPDIR=/mnt; else SWAPDIR=/; fi
          echo "Creating 16G swap at ${SWAPDIR}/swapfile"
          sudo fallocate -l 16G "$SWAPDIR/swapfile" \
            || sudo dd if=/dev/zero of="$SWAPDIR/swapfile" bs=1M count=16384 status=none
          sudo chmod 600 "$SWAPDIR/swapfile"
          sudo mkswap "$SWAPDIR/swapfile"
          sudo swapon "$SWAPDIR/swapfile"
          sudo sysctl -w vm.swappiness=100

          echo "=== AFTER ==="
          df -h / /mnt 2>/dev/null || true
          free -h || true

      # ------------------------------------------------------------------
      # Step 2 - build dependencies (JDK 17 for the Android 16 base)
      # ------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip rsync lz4 liblz4-tool zstd bc cpio \
            openjdk-17-jdk
          java -version
          git --version

      # ------------------------------------------------------------------
      # Step 3 - repo init (OrangeFox fox_16.0) + generated local manifest
      #          (GitLab throttles bursts: repo init is retried)
      # ------------------------------------------------------------------
      - name: repo init (OrangeFox) + local manifest (malachite)
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false
          mkdir -p ~/bin "$SRC"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="$HOME/bin:$PATH"
          cd "$SRC"
          ok=0
          for i in 1 2 3; do
            echo "=== repo init attempt $i ==="
            if repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"; then ok=1; break; fi
            echo "repo init failed (GitLab throttling?) - retrying"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::repo init failed after 3 attempts"
            exit 1
          fi
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/malachite.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="ghdev" fetch="https://github.com/" />
            <project path="device/xiaomi/malachite" name="${DT_REPO}" remote="ghdev" revision="${DT_BRANCH}" />
          </manifest>
          XML
          cat .repo/local_manifests/malachite.xml

      # ------------------------------------------------------------------
      # Step 4 - repo sync, parse-guarded and throttling-tolerant:
      #          (a) base manifest parse-check with dangling-remove auto-fix
      #          (b) dynamic overlay for unfetchable private repos
      #          (c) effective re-parse + warning-only pre-flight probes
      #          (d) sync retry ladder
      # ------------------------------------------------------------------
      - name: Sync OrangeFox source tree (parse-guarded, throttling-tolerant)
        run: |
          export PATH="$HOME/bin:$PATH"
          cd "$SRC"

          # ---------- (a) base manifest parse-check + auto-fix ----------
          fixes=0
          until repo manifest -o /tmp/manifest_effective.xml >/tmp/manifest_check.log 2>&1; do
            cat /tmp/manifest_check.log || true
            BAD=$(grep -Eo 'remove-project element specifies non-existent project: .+' /tmp/manifest_check.log \
                  | head -n1 | sed -E 's/.*\b(name|path)="([^"]+)".*/\2/' || true)
            if [ -z "$BAD" ] || [ "$fixes" -ge 20 ]; then
              echo "::error::manifest does not parse and no auto-fix is available"
              exit 1
            fi
            echo "auto-fix: stripping dangling remove-project '$BAD'"
            for f in .repo/manifests/*.xml; do
              python3 - "$f" "$BAD" <<'PY'
          import sys, re
          path, bad = sys.argv[1], sys.argv[2]
          s = open(path).read()
          pat = re.compile(r'\n?[ \t]*<remove-project\b[^>]*\b(?:name|path)="' + re.escape(bad) + r'"[^>]*/>[ \t]*')
          new = pat.sub('\n', s)
          if new != s:
              open(path, 'w').write(new)
              print(f'stripped from {path}')
          PY
              git -C .repo/manifests add -A >/dev/null 2>&1 || true
              git -C .repo/manifests commit -qm "ci: drop dangling remove-project $BAD" >/dev/null 2>&1 || true
            done
            fixes=$((fixes + 1))
          done
          echo "Manifest parse: OK ($(grep -c '<project ' /tmp/manifest_effective.xml) projects)"

          # ---------- (b) overlay: unfetchable OrangeFox repos ----------
          # fox.xml pins some new rclone-rollout feature repos to raw SHAs on
          # gitlab.com/OrangeFox repos that are NOT anonymously fetchable, and
          # nothing in the current bootable/recovery + vendor/* build graph
          # references them. Remove them dynamically (intersected with what is
          # actually present, so this overlay can never dangle).
          cat > /tmp/unfetchable.txt <<'EOF'
          external/libarchive
          external/libfuse3
          external/icu
          external/fox-go
          EOF
          python3 - <<'PY'
          import os, re
          eff = open('/tmp/manifest_effective.xml').read()
          names = set(re.findall(r'<project\b[^>]*\bname="([^"]+)"', eff))
          cands = [l.strip() for l in open('/tmp/unfetchable.txt') if l.strip()]
          present = [c for c in cands if c in names]
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!-- CI: drop OrangeFox feature repos pinned to privately-fetchable',
              '     revisions (rclone rollout not wired into the build graph yet). -->',
              '<manifest>',
          ]
          for p in present:
              lines.append(f'    <remove-project name="{p}" />')
          lines.append('</manifest>')
          os.makedirs('.repo/local_manifests', exist_ok=True)
          open('.repo/local_manifests/ci-remove-unfetchable.xml', 'w').write('\n'.join(lines) + '\n')
          print('ci-remove-unfetchable overlay removes:', present if present else 'nothing')
          PY
          cat .repo/local_manifests/ci-remove-unfetchable.xml

          # ---------- (c) effective re-parse + pre-flight probes ----------
          if ! repo manifest -o /tmp/manifest_effective2.xml >/tmp/manifest_check2.log 2>&1; then
            cat /tmp/manifest_check2.log || true
            echo "::error::effective manifest (with overlay) does not parse"
            exit 1
          fi
          echo "Effective manifest: OK ($(grep -c '<project ' /tmp/manifest_effective2.xml) projects)"
          # Warning-only: GitLab throttles anonymous bursts, so treat this as
          # diagnostics, never as a gate.
          python3 - <<'PY'
          import re, subprocess
          eff = open('/tmp/manifest_effective2.xml').read()
          projs = re.findall(r'<project\b[^>]*\bname="([^"]+)"[^>]*\bremote="([^"]+)"', eff)
          fox = [n for n, r in projs if r == 'OrangeFox']
          print(f'pre-flight: probing {len(fox)} OrangeFox-remote projects (warning-only)')
          unreachable = []
          for n in fox:
              ok = False
              for _ in range(3):
                  r = subprocess.run(['git', 'ls-remote', '--exit-code',
                                      'https://gitlab.com/OrangeFox/' + n, 'HEAD'],
                                     capture_output=True)
                  if r.returncode == 0:
                      ok = True
                      break
                  subprocess.run(['sleep', '3'])
              if not ok:
                  unreachable.append(n)
          for n in unreachable:
              print(f'::warning::unfetchable OrangeFox repo: {n}')
          if not unreachable:
              print('pre-flight: all reachable')
          PY

          # ---------- (d) sync retry ladder ----------
          set +e
          ok=0
          echo "=== repo sync attempt 1: -j8 --fail-fast ==="
          repo sync -c -j8 --fail-fast
          rc=$?
          if [ $rc -eq 0 ]; then
            ok=1
          else
            echo "=== repo sync attempt 2: -j4 --force-sync (incremental) ==="
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
            rc=$?
            if [ $rc -eq 0 ]; then
              ok=1
            else
              echo "=== repo sync attempt 3: -j2 --force-sync (incremental) ==="
              repo sync -c -j2 --force-sync --no-clone-bundle --no-tags
              rc=$?
              if [ $rc -eq 0 ]; then ok=1; fi
            fi
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::error::repo sync failed at every ladder level (last rc=$rc)"
            exit 1
          fi
          set -e

          # Drift early-warning: if upstream later wires the removed repos into
          # the build graph, say so loudly in the log.
          if grep -rEl "libarchive|libfuse3|fox-go" bootable/recovery vendor/recovery vendor/twrp \
               --include='*.bp' --include='*.mk' 2>/dev/null \
               | grep -Ev "libfusesideload|libfusetwrp" ; then
            echo "::warning::upstream now references removed projects - review ci-remove-unfetchable.xml"
          else
            echo "drift check: no references to removed projects (good)"
          fi
          df -h /
          du -sh .repo 2>/dev/null || true

      # ------------------------------------------------------------------
      # Step 5 - tolerant verify of the synced tree
      # ------------------------------------------------------------------
      - name: Verify synced tree
        run: |
          set -e
          cd "$SRC"
          FAIL=0
          for p in build/envsetup.sh vendor/twrp/config/common.mk vendor/recovery bootable/recovery device/xiaomi/malachite; do
            if [ -e "$p" ]; then echo "OK   $p"; else echo "::error::missing $p"; FAIL=1; fi
          done
          if [ ! -f vendorsetup.sh ]; then
            echo "note: no legacy root vendorsetup.sh (normal on fox_16.0)"
          fi
          ls -l device/xiaomi/malachite/prebuilt/dtb || { echo "::error::prebuilt dtb missing"; FAIL=1; }
          ls -l device/xiaomi/malachite/recovery/root/system/etc/recovery.fstab || true
          if [ "$FAIL" -ne 0 ]; then exit 1; fi

      # ------------------------------------------------------------------
      # Step 6 - fox-ify the device tree:
      #   a) vendorsetup.sh contract (FOX_* build vars; OrangeFox envsetup
      #      sources every device tree's vendorsetup.sh)
      #   b) fox_malachite.mk with OF_* UI flags (official amethyst template)
      #   c) wire fox_malachite.mk into twrp_malachite.mk
      #   d) drop modules removed in Android 16 (keymaster HAL 3.0)
      #   e) apply the proven minuitwrp haptics patch when applicable
      # ------------------------------------------------------------------
      - name: Fox-ify device tree (contract + flags + patch)
        run: |
          set -e
          cd "$SRC"
          DEV="device/xiaomi/malachite"

          # (a) vendorsetup.sh - official fox_16.0 device-tree contract
          cat > "$DEV/vendorsetup.sh" <<'VSEOF'
          #!/bin/bash
          # CI-generated OrangeFox build vars for malachite (Redmi Note 14 Pro 5G)
          # Template: official fox_16.0 device trees (chkndrp/amethyst pattern)
          FDEVICE="malachite"

          fox_get_target_device() {
              local src=""
              if [ -n "$ZSH_VERSION" ]; then src="${(%):-%x}"
              elif [ -n "$BASH_VERSION" ]; then src="${BASH_SOURCE[0]}"
              else src="$0"; fi
              if echo "$src" | grep -q "$FDEVICE"; then FOX_BUILD_DEVICE="$FDEVICE"
              elif [ -n "$BASH_VERSION" ] && set | grep BASH_ARGV | grep -q -w "$FDEVICE"; then FOX_BUILD_DEVICE="$FDEVICE"
              elif echo "$* $0" | grep -q -w "$FDEVICE"; then FOX_BUILD_DEVICE="$FDEVICE"
              fi
          }

          if [ -z "$1" ] && [ -z "$FOX_BUILD_DEVICE" ]; then fox_get_target_device "$@"; fi

          if [ "$1" = "$FDEVICE" ] || [ "$FOX_BUILD_DEVICE" = "$FDEVICE" ]; then
              export TARGET_DEVICE_ALT="malachite"
              # Binaries & tools
              export FOX_USE_BUSYBOX_BINARY=1
              export FOX_USE_BASH_SHELL=1
              export FOX_USE_TAR_BINARY=1
              export FOX_USE_SED_BINARY=1
              export FOX_USE_XZ_UTILS=1
              export FOX_USE_ZSTD_BINARY=1
              export FOX_USE_LZ4_BINARY=1
              export FOX_USE_DATE_BINARY=1
              export FOX_USE_FSCK_EROFS_BINARY=1
              export FOX_USE_PATCHELF_BINARY=1
              export FOX_USE_GREP_BINARY=1
              export FOX_ASH_IS_BASH=1
              export FOX_BASH_TO_SYSTEM_BIN=1
              export FOX_REPLACE_TOOLBOX_GETPROP=1
              # Settings / data storage
              export FOX_SETTINGS_ROOT_DIRECTORY="/data/recovery"
              export FOX_MISCELLANEOUS_ROOT_DIRECTORY="/sdcard"
              export FOX_ALLOW_EARLY_SETTINGS_LOAD=1
              # Addons
              export FOX_ENABLE_APP_MANAGER=1
              export FOX_DELETE_AROMAFM=1
              export FOX_NO_BLANK_DT2W=1
              # Magisk / KernelSU(-Next) / SukiSU support
              export FOX_ENABLE_KERNELSU_SUPPORT=1
              export FOX_ENABLE_KERNELSU_NEXT_SUPPORT=1
              export FOX_ENABLE_SUKISU_SUPPORT=1
              export FOX_MOVE_MAGISK_INSTALLER_TO_RAMDISK=1
              # A/B partitioning
              export FOX_VIRTUAL_AB_DEVICE=1
              export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/mapper/system"
              export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/mapper/vendor"
              # Modern magiskboot for a recent device
              export FOX_USE_UPDATED_MAGISKBOOT=1
              # CI: single-shot build, no ccache
              export USE_CCACHE=0
              export LC_ALL="C"
              export BUILD_USERNAME=ci-builder
              export BUILD_HOSTNAME=orangefox
          else
              if [ -z "$FOX_BUILD_DEVICE" ] && [ -z "$BASH_SOURCE" ] && [ -z "$ZSH_VERSION" ]; then
                  echo "W: This script requires bash or zsh. Not processing $FDEVICE"
              fi
          fi
          VSEOF
          chmod +x "$DEV/vendorsetup.sh"

          # (b) fox_malachite.mk - OrangeFox UI/build flags
          cat > "$DEV/fox_malachite.mk" <<'FOXEOF'
          # OrangeFox-specific flags for malachite (CI-generated).
          # Reference: official fox_16.0 device trees (chkndrp/amethyst).
          OF_MAINTAINER := UNOFFICIAL-malachite

          # Screen settings (1220x2712)
          OF_SCREEN_H := 2712
          OF_STATUS_H := 100
          OF_STATUS_INDENT_LEFT := 48
          OF_STATUS_INDENT_RIGHT := 48
          OF_ALLOW_DISABLE_NAVBAR := 0
          OF_CLOCK_POS := 1
          OF_OPTIONS_LIST_NUM := 9

          # Quick backup (recovery itself lives in vendor_boot on this device)
          OF_QUICK_BACKUP_LIST := /vendor_boot;/persist_image;

          # Flashlight & LEDs
          OF_FL_PATH1 := /tmp/of_torch
          OF_USE_GREEN_LED := 0

          # Security (disables MTP & ADB during password prompt)
          OF_ADVANCED_SECURITY := 1

          # A/B partitioning
          OF_VAB_ORS_WIPE_DATA_IS_FORMAT := 1
          OF_ENABLE_ALL_PARTITION_TOOLS := 1

          # Workarounds
          OF_LOOP_DEVICE_ERRORS_TO_LOG := 1
          OF_NO_TREBLE_COMPATIBILITY_CHECK := 1
          OF_USE_LEGACY_TIME_FIXUP := 1

          # Data / Metadata (f2fs userdata)
          OF_WIPE_METADATA_AFTER_DATAFORMAT := 1
          OF_UNBIND_SDCARD_F2FS := 1
          OF_FORCE_CASEFOLDING := 1
          OF_USE_DMCTL := 1

          # FRP reset addon
          OF_ENABLE_FRP_ADDON := 1
          FOXEOF

          # (c) wire fox_malachite.mk into the product chain
          python3 - "$DEV/twrp_malachite.mk" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if 'fox_malachite.mk' not in s:
              line = ('# Import OrangeFox specifics\n'
                      '$(call inherit-product, $(DEVICE_PATH)/fox_malachite.mk)')
              anchor = '$(call inherit-product, $(DEVICE_PATH)/device.mk)'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n\n' + line, 1)
              else:
                  s = s.rstrip() + '\n\n' + line + '\n'
              open(p, 'w').write(s)
              print('fox_malachite.mk wired into twrp_malachite.mk')
          else:
              print('fox_malachite.mk already wired')
          PY

          # (d) Android 16 removed the keymaster HAL 3.0 module; the tree was
          #     written against TWRP 14.1. Drop it or soong will refuse to run.
          sed -i '/keymaster@3\.0/d' "$DEV/device.mk"

          # (e) haptics patch proven against TeamWin android-14.1; apply only
          #     when it still fits the fox_16.0 recovery sources.
          if git -C bootable/recovery apply --check \
               "$DEV/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch" 2>/dev/null; then
            git -C bootable/recovery apply \
              "$DEV/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch"
            echo "haptics patch applied"
          else
            echo "haptics patch not applicable on this base - skipped (expected on fox_16.0)"
          fi

          echo "=== fox-ified tree summary ==="
          ls -l "$DEV/vendorsetup.sh" "$DEV/fox_malachite.mk"
          grep -n "fox_malachite" "$DEV/twrp_malachite.mk"

      # ------------------------------------------------------------------
      # Step 7 - build the vendor_boot image
      #   anti-OOM: GOMEMLIMIT (Go heap cap for soong_build), -j2, retries
      #   with automatic "missing module" repair and OOM evidence dumps.
      # ------------------------------------------------------------------
      - name: Build vendor_boot image (anti-OOM + auto-retry)
        run: |
          export PATH="$HOME/bin:$PATH"
          cd "$SRC"
          LOG=/tmp/build.log
          START=$(date +%s)
          set +e

          # OrangeFox envsetup scans and sources every device tree's
          # vendorsetup.sh; the no-match path returns non-zero, which is
          # benign but would kill a `bash -e` step - hence set +e.
          source build/envsetup.sh
          echo "envsetup rc=$? (non-zero tolerated; validated via lunch below)"

          # fox_16.0 = Android 16 (bp2a). Ladder ordered: official convention
          # first, then every other release config known to exist.
          REL_LIST="bp2a ap2a ap4a bp1a ap3a trunk_staging"
          TARGET_LUNCH=""
          for R in $REL_LIST; do
            if ( lunch "twrp_malachite-$R-eng" ) >/tmp/lunch_$R.log 2>&1; then
              TARGET_LUNCH="twrp_malachite-$R-eng"
              break
            else
              echo "lunch twrp_malachite-$R-eng failed:"
              tail -n 5 /tmp/lunch_$R.log || true
            fi
          done
          if [ -z "$TARGET_LUNCH" ]; then
            echo "all release candidates failed - removing TWRP-14.1 PLATFORM_VERSION spoof and retrying"
            sed -i -e '/^PLATFORM_VERSION := 99/d' -e '/^PLATFORM_VERSION_LAST_STABLE/d' \
              device/xiaomi/malachite/BoardConfig.mk
            for R in $REL_LIST; do
              if ( lunch "twrp_malachite-$R-eng" ) >/tmp/lunch2_$R.log 2>&1; then
                TARGET_LUNCH="twrp_malachite-$R-eng"
                break
              fi
            done
          fi
          if [ -z "$TARGET_LUNCH" ]; then
            echo "::error::no lunchable product/release combo"
            tail -n 60 /tmp/lunch_*.log 2>/dev/null || true
            exit 1
          fi
          echo "TARGET_LUNCH=$TARGET_LUNCH"
          lunch "$TARGET_LUNCH"

          echo "=== resource snapshot before build ==="
          free -h || true
          df -h / || true
          trap 'echo "=== TERM/INT received ==="; df -h /; free -h; ps aux --sort=-%mem | head -n 8' TERM INT

          attempt=1
          max_attempt=5
          while true; do
            echo "=== BUILD ATTEMPT $attempt/$max_attempt (GOMEMLIMIT=$GOMEMLIMIT GOGC=$GOGC -j$BUILD_JOBS) ==="
            m "-j$BUILD_JOBS" vendorbootimage 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "BUILD OK on attempt $attempt"
              break
            fi

            elapsed=$(( ($(date +%s) - START) / 60 ))
            echo "=== attempt $attempt FAILED (rc=$rc, ${elapsed}m elapsed) ==="
            if [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then
              echo "process was SIGKILLed/SIGTERMed (OOM or external kill)"
            fi
            tail -n 150 "$LOG" || true
            echo "=== memory / disk / OOM evidence ==="
            free -h || true
            df -h / || true
            ( dmesg 2>/dev/null || sudo dmesg ) \
              | grep -iE "oom|out of memory|killed process" | tail -n 10 || true

            if [ "$attempt" -ge "$max_attempt" ]; then
              echo "::error::build failed after $max_attempt attempts"
              exit 1
            fi
            if [ "$elapsed" -gt 300 ]; then
              echo "::error::not enough time left for another retry (job timeout 360m). Re-run the workflow to continue incrementally."
              exit 1
            fi

            # Auto-fix: if product-config/soong complains about a missing or
            # unknown module, remove it from the device tree and retry. This
            # heals base-vs-tree module skew (e.g. keymaster/health HALs).
            MOD=$(grep -Eho 'unknown module "?[A-Za-z0-9._@/-]+"?|module "?[A-Za-z0-9._@/-]+"? does not exist|missing dependency: [A-Za-z0-9._@/-]+' "$LOG" \
                  | head -n1 | sed -E 's/.*[ :"]([A-Za-z0-9._@/-]+)"?$/\1/' || true)
            if [ -n "$MOD" ]; then
              echo "auto-fix: dropping module '$MOD' from device makefiles"
              grep -rl -- "$MOD" device/xiaomi/malachite/ 2>/dev/null \
                | while read -r f; do sed -i "\%$MOD%d" "$f"; done
            else
              echo "no auto-fix pattern matched - retrying incrementally"
            fi
            attempt=$((attempt + 1))
          done

          echo "=== final build state ==="
          free -h || true
          df -h / || true

      # ------------------------------------------------------------------
      # Step 8 - collect + upload artifacts
      # ------------------------------------------------------------------
      - name: Collect artifacts
        run: |
          set -e
          cd "$SRC"
          PROD="out/target/product/$DEVICE"
          echo "=== product dir ==="
          ls -la "$PROD" || true
          mkdir -p "$GITHUB_WORKSPACE/foxout"
          if [ -f "$PROD/vendor_boot.img" ]; then
            cp "$PROD/vendor_boot.img" \
              "$GITHUB_WORKSPACE/foxout/OrangeFox-Unofficial-malachite-vendor_boot.img"
          else
            echo "::error::vendor_boot.img was not produced"
            exit 1
          fi
          find "$PROD" -maxdepth 1 -type f \( -iname '*orangefox*' -o -iname '*fox*.zip' \) \
            -exec cp {} "$GITHUB_WORKSPACE/foxout/" \; || true
          cd "$GITHUB_WORKSPACE/foxout"
          sha256sum ./* | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-unofficial-malachite
          path: foxout/
          retention-days: 30
          if-no-files-found: error

      - name: Print flash instructions
        run: |
          echo "=================================================================="
          echo " Flashing (bootloader must be UNLOCKED):"
          echo "   1. Download artifact: OrangeFox-unofficial-malachite"
          echo "   2. adb reboot bootloader"
          echo "   3. fastboot flash vendor_boot OrangeFox-Unofficial-malachite-vendor_boot.img"
          echo "   4. fastboot reboot recovery   (or: fastboot reboot, then hold Vol+)"
          echo ""
          echo " Installing ROMs from OrangeFox:"
          echo "   - Install ZIP : payload.bin (A/B OTA) zips install via the built-in A/B updater"
          echo "   - ADB Sideload: Advanced > ADB Sideload, then: adb sideload <rom.zip>"
          echo "=================================================================="
