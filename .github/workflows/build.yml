name: Build OrangeFox Recovery

env:
  FOX_MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git
  FOX_BRANCH: fox_16.0
  SYNC_JOBS: 6
  BUILD_JOBS: 2
  MIN_FREE_MB: 25000

on:
  workflow_dispatch:
    inputs:
      selinux_permissive:
        description: Add androidboot.selinux=permissive to the vendor cmdline only if the recovery fails to boot with SELinux enforcing
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build OrangeFox for malachite
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout build package
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Prepare workspace and check disk space
        run: |
          echo "CPU: $(nproc --all) | RAM: $(free -g | awk '/Mem:/ {print $2}') GB"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google \
            /usr/local/share/powershell /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/share/miniconda \
            /usr/local/julia* /usr/lib/firefox /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          df -h / /mnt
          ROOT_MB=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          MNT_MB=$(df -BM --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          MNT_MB=${MNT_MB:-0}
          if [ "$MNT_MB" -gt "$ROOT_MB" ] && [ "$MNT_MB" -gt 15000 ]; then
            sudo mkdir -p /mnt/fox && sudo chown -R "$(id -u):$(id -g)" /mnt/fox
            ln -sfn /mnt/fox /home/runner/fox
            mkdir -p "$HOME/fox-out"
            OUTVAL="$HOME/fox-out"
            echo "OUT_DIR=$OUTVAL" >> "$GITHUB_ENV"
            AVAIL=$MNT_MB
          else
            mkdir -p /home/runner/fox
            if [ "$MNT_MB" -gt 15000 ]; then
              sudo mkdir -p /mnt/fox-out && sudo chown -R "$(id -u):$(id -g)" /mnt/fox-out
              OUTVAL=/mnt/fox-out
              echo "OUT_DIR=$OUTVAL" >> "$GITHUB_ENV"
            else
              mkdir -p "$HOME/fox-out"
              OUTVAL="$HOME/fox-out"
              echo "OUT_DIR=$OUTVAL" >> "$GITHUB_ENV"
            fi
            AVAIL=$ROOT_MB
          fi
          echo "Source tree disk has ${AVAIL} MB free, build output goes to ${OUTVAL}"
          if [ "$AVAIL" -lt "$MIN_FREE_MB" ]; then
            echo "::error::Not enough disk space (${AVAIL} MB free). At least ${MIN_FREE_MB} MB is required."
            exit 1
          fi
          sudo fallocate -l 8G /tmp/swapfile 2>/dev/null || true
          if [ -f /tmp/swapfile ]; then
            sudo chmod 600 /tmp/swapfile
            sudo mkswap /tmp/swapfile || true
            sudo swapon /tmp/swapfile || true
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core git-lfs gnupg flex bison \
            build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip lz4 bc ccache rsync libssl-dev openjdk-17-jdk
          mkdir -p $HOME/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false
          git lfs install
          sudo apt-get clean

      - name: Sync OrangeFox fox_16.0 source tree
        timeout-minutes: 170
        run: |
          mkdir -p $HOME/fox && cd $HOME/fox
          OK=0
          for i in 1 2 3; do
            rm -rf .repo
            if repo init --depth=1 -u "$FOX_MANIFEST_URL" -b "$FOX_BRANCH"; then OK=1; break; fi
            echo "repo init attempt $i failed, retrying in 15 seconds"
            sleep 15
          done
          if [ "$OK" != 1 ]; then
            echo "::error::repo init failed for $FOX_MANIFEST_URL branch $FOX_BRANCH"
            exit 1
          fi
          (
            while true; do
              sleep 120
              A=$(df -BM --output=avail "$HOME/fox" 2>/dev/null | tail -1 | tr -dc '0-9')
              echo "[watch] $(date -u +%H:%M:%S) source disk ${A:-unknown} MB free"
            done
          ) &
          LOGGER=$!
          SYNC_START=$(date -u +%s)
          set +e
          repo sync -c -j"$SYNC_JOBS" --force-sync --no-clone-bundle --no-tags
          RC=$?
          if [ "$RC" != 0 ]; then
            echo "First sync pass failed with code $RC, retrying with 2 jobs"
            repo sync -c -j2 --force-sync --no-clone-bundle --no-tags
            RC=$?
          fi
          kill "$LOGGER" 2>/dev/null || true
          echo "Sync finished with code $RC after $(( ($(date -u +%s) - SYNC_START) / 60 )) minutes"
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          exit $RC

      - name: Place the malachite device tree
        run: |
          set -e
          cd $HOME/fox
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/malachite
          cp -a "$GITHUB_WORKSPACE/device_tree" device/xiaomi/malachite
          test -f device/xiaomi/malachite/twrp_malachite.mk
          test -f device/xiaomi/malachite/prebuilt/dtb
          cd device/xiaomi/malachite
          git init -q -b main
          git add -A
          git commit -qm "malachite OrangeFox device tree"

      - name: Apply the recovery touch haptics patch
        run: |
          cd $HOME/fox
          P=device/xiaomi/malachite/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch
          if git -C bootable/recovery apply --check "$P"; then
            git -C bootable/recovery apply "$P"
            echo "Haptics patch applied"
          elif git -C bootable/recovery apply --check --3way "$P"; then
            git -C bootable/recovery apply --3way "$P"
            echo "Haptics patch applied with a 3way merge"
          else
            echo "::warning::Haptics patch does not apply to this bootable/recovery revision, continuing without it"
          fi

      - name: Free disk space in the source tree
        run: |
          cd $HOME/fox
          rm -rf .repo/project-objects .repo/worktrees
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"

      - name: Build OrangeFox vendor_boot image
        timeout-minutes: 170
        env:
          PERM: ${{ inputs.selinux_permissive }}
        run: |
          cd $HOME/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=malachite
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export FOX_VIRTUAL_AB_DEVICE=1
          if [ "$PERM" = "true" ]; then export MALACHITE_RECOVERY_PERMISSIVE=true; fi
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          BUILD_START=$(date -u +%s)
          (
            while true; do
              sleep 120
              A=$(df -BM --output=avail "$HOME/fox" 2>/dev/null | tail -1 | tr -dc '0-9')
              B=$(df -BM --output=avail "$OUT_DIR" 2>/dev/null | tail -1 | tr -dc '0-9')
              R=$(free -m | awk '/^Mem:/ {print $7}')
              echo "[watch] $(date -u +%H:%M:%S) source ${A:-unknown} MB free, output ${B:-unknown} MB free, ram available ${R:-unknown} MB"
            done
          ) &
          LOGGER=$!
          set +e
          source build/envsetup.sh
          LUNCHED=0
          for T in twrp_malachite-bp2a-eng twrp_malachite-ap2a-eng twrp_malachite-eng; do
            echo "Trying lunch target $T at $(date -u +%H:%M:%S)"
            if lunch "$T"; then LUNCHED=1; break; fi
          done
          if [ "$LUNCHED" != 1 ]; then
            echo "::error::No valid lunch target for twrp_malachite on this OrangeFox source tree"
            kill "$LOGGER" 2>/dev/null || true
            exit 1
          fi
          echo "Lunch done at $(date -u +%H:%M:%S), elapsed $(( ($(date -u +%s) - BUILD_START) / 60 )) minutes, starting mka vendorbootimage"
          mka vendorbootimage -j"$BUILD_JOBS" 2>&1 | tee $HOME/build.log
          RC=${PIPESTATUS[0]}
          kill "$LOGGER" 2>/dev/null || true
          echo "Build finished with code $RC after $(( ($(date -u +%s) - BUILD_START) / 60 )) minutes"
          df -h "$HOME/fox" "$OUT_DIR" || df -h "$HOME/fox"
          exit $RC

      - name: Collect build outputs
        run: |
          OUT=$OUT_DIR/target/product/malachite
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ ! -f "$OUT/vendor_boot.img" ]; then
            echo "::error::vendor_boot.img was not produced"
            tail -50 $HOME/build.log || true
            exit 1
          fi
          cp "$OUT/vendor_boot.img" "$GITHUB_WORKSPACE/output/vendor_boot.img"
          find "$OUT" -maxdepth 1 -name "OrangeFox*.zip" -exec cp {} "$GITHUB_WORKSPACE/output/" \; || true
          find "$OUT" -maxdepth 1 -name "OrangeFox*.img" -exec cp {} "$GITHUB_WORKSPACE/output/" \; || true
          cd "$GITHUB_WORKSPACE/output"
          sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt
          ls -lh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-malachite
          path: output/*
          if-no-files-found: error
          retention-days: 30
